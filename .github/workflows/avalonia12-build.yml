name: Patroclus Avalonia 12 build

on:
  push:
    branches:
      - modern-ui-avalonia12
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore patroclus.sln

      - name: Build Avalonia project
        run: dotnet build Patroclus.Avalonia/Patroclus.Avalonia.csproj --configuration Release --no-restore